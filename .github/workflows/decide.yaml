# Generated by scripts/render.py; edit scripts and regenerate.
name: Decide publication
'on':
  workflow_call:
    inputs:
      image:
        type: string
        default: ''
      mode:
        type: string
        default: edge
      version-file:
        type: string
        default: VERSION
      input-paths:
        type: string
        default: '[]'
      force:
        type: boolean
        default: false
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
    outputs:
      build:
        value: ${{ jobs.decide.outputs.build }}
      version:
        value: ${{ jobs.decide.outputs.version }}
      fingerprint:
        value: ${{ jobs.decide.outputs.fingerprint }}
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends skopeo
      if: ${{ inputs.image != '' }}
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
      if: ${{ inputs.image != '' }}
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: ${{ inputs.image != '' }}
    - id: decide
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE: ${{ inputs.image }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        MODE: ${{ inputs.mode }}
        VERSION_FILE: ${{ inputs.version-file }}
        INPUT_PATHS: ${{ inputs.input-paths }}
        FORCE: ${{ inputs.force }}
      run: |
        python3 - <<'PUBLISH_POLICY'
        """Pure publishing decisions, also embedded verbatim in reusable workflows."""
        import re


        def stable_version(value):
            if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', value):
                raise ValueError('Expected a stable X.Y.Z version')
            return tuple(map(int, value.split('.')))


        def release_identity(version, revision=None):
            if revision is None:
                stable_version(version)
                return version
            if not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,110}', version):
                raise ValueError('Invalid upstream image version')
            if not re.fullmatch(r'[1-9]\d*', str(revision)):
                raise ValueError('Packaging revision must be a positive integer')
            return f'{version}-r{revision}'


        def build_decision(*, manual, force, failed, source_matches, mirrors_match):
            if force and not manual:
                raise ValueError('Force is only allowed on manual runs')
            if force:
                return 'build'
            if source_matches and mirrors_match:
                return 'skip-success'
            if failed and not manual:
                return 'skip-failure'
            return 'build'


        def immutable_decision(existing, candidate):
            if existing is None:
                return 'publish'
            if existing == candidate:
                return 'skip'
            raise ValueError('Immutable version already contains a different digest')


        def latest_decision(existing_version, candidate_version):
            candidate = stable_version(candidate_version)
            if existing_version is None:
                return True
            return candidate > stable_version(existing_version)


        def assert_forward(current, candidate, is_ancestor):
            if current is not None and current != candidate and not is_ancestor(current, candidate):
                raise ValueError('Refusing to replace a newer or unrelated source revision')


        def validate_platforms(index, required):
            actual = {f"{m.get('platform', {}).get('os')}/{m.get('platform', {}).get('architecture')}"
                      for m in index.get('manifests', [])}
            missing = set(required.split(',')) - actual
            if missing:
                raise ValueError(f'Missing image platforms: {sorted(missing)}')

        """Trusted registry and GitHub clients embedded into the workflow definition."""
        import hashlib
        import json
        import os
        import re
        from pathlib import Path
        import subprocess


        def command(args, *, missing=False):
            result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
            if result.returncode:
                error = result.stderr.decode(errors='replace')
                if missing and any(marker in error.lower() for marker in ('manifest unknown', 'name unknown', 'manifest_unknown')):
                    return None
                # Do not echo command arguments or registry responses containing credentials.
                raise RuntimeError(f'{args[0]} failed with exit code {result.returncode}')
            return result.stdout


        def inspect_image(reference):
            raw = command(['skopeo', 'inspect', '--raw', reference], missing=True)
            if raw is None:
                return None
            metadata = json.loads(command(['skopeo', 'inspect', '--override-os', 'linux', '--override-arch', 'amd64', reference]))
            return {'digest': metadata['Digest'], 'revision': metadata.get('Labels', {}).get('org.opencontainers.image.revision'),
                    'version': metadata.get('Labels', {}).get('org.opencontainers.image.version'),
                    'fingerprint': metadata.get('Labels', {}).get('io.zekihan.build-inputs'), 'index': json.loads(raw)}


        def github(endpoint):
            return json.loads(command(['gh', 'api', endpoint]))


        def ancestor(old, new):
            if not all(re.fullmatch(r'[0-9a-f]{40}', value) for value in (old, new)):
                return False
            return subprocess.run(['git', 'merge-base', '--is-ancestor', old, new], check=False).returncode == 0


        def output(values):
            with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                for name, value in values.items():
                    value = str(value)
                    if '\n' in value or '\r' in value:
                        raise ValueError('Multiline workflow output rejected')
                    stream.write(f'{name}={value}\n')


        def image_names():
            image = os.environ['IMAGE']
            owner = os.environ['GITHUB_REPOSITORY_OWNER'].lower()
            docker_owner = os.environ['DOCKER_USERNAME']
            for value in (image, owner, docker_owner):
                if not re.fullmatch(r'[a-z0-9][a-z0-9_.-]*', value):
                    raise ValueError('Invalid image or registry namespace')
            return [f'ghcr.io/{owner}/{image}', f'docker.io/{docker_owner}/{image}']


        def publish_copy(source, destination):
            command(['skopeo', 'copy', '--all', '--preserve-digests', source, destination])


        def verify_access(reference, digest):
            if os.environ.get('PUBLIC_IMAGE') == 'true':
                remote = command(['skopeo', 'inspect', '--no-creds', '--format', '{{.Digest}}', reference]).decode().strip()
                if remote != digest:
                    raise ValueError('Anonymous pull does not resolve to the published image')


        def verify_archive(path, expected):
            if not re.fullmatch(r'[0-9a-f]{64}', expected):
                raise ValueError('Missing or invalid expected artifact checksum')
            with Path(path).open('rb') as stream:
                digest = hashlib.file_digest(stream, 'sha256').hexdigest()
            if digest != expected:
                raise ValueError('Artifact checksum does not match build job output')

        def decide():
            ref = os.environ['GITHUB_REF']
            event = os.environ['GITHUB_EVENT_NAME']
            mode = os.environ['MODE']
            sha = os.environ['GITHUB_SHA']
            if mode not in ('edge', 'release', 'declarative'):
                raise ValueError('Unknown publication mode')
            if mode == 'release':
                version = Path(os.environ['VERSION_FILE']).read_text().strip()
                stable_version(version)
                if ref != f'refs/tags/v{version}':
                    raise ValueError('Release tag must match VERSION')
                main = command(['git', 'rev-parse', 'origin/main']).decode().strip()
                if not ancestor(sha, main):
                    raise ValueError('Release commit is outside main history')
                output({'build': 'true', 'version': version, 'fingerprint': sha})
                return
            if ref != 'refs/heads/main' or event not in ('schedule', 'workflow_dispatch'):
                raise ValueError('Development publishing is main-only and scheduled/manual')
            image = os.environ['IMAGE']
            paths = json.loads(os.environ.get('INPUT_PATHS', '[]'))
            if paths:
                entries = command(['git', 'ls-tree', '-r', 'HEAD', '--', *paths])
                if not entries:
                    raise ValueError('Build input paths selected no files')
                fingerprint = hashlib.sha256(entries).hexdigest()
            else:
                fingerprint = sha
            version = ''
            if mode == 'declarative':
                import shlex
                config = {}
                for line in Path(os.environ['VERSION_FILE']).read_text().splitlines():
                    if re.match(r'^(version|revision):', line):
                        key, value = line.split(':', 1)
                        words = shlex.split(value, comments=True)
                        if len(words) != 1:
                            raise ValueError('Expected scalar version/revision')
                        config[key] = words[0]
                version = release_identity(config['version'], config['revision'])
            names = image_names()
            images = []
            try:
                images = [inspect_image(f'docker://{name}:edge') for name in names]
            except RuntimeError:
                print('Registry state could not be verified; not assuming publication succeeded')
            source_matches = len(images) == 2 and all(x and x['fingerprint'] == fingerprint for x in images)
            mirrors_match = bool(source_matches and images[0]['digest'] == images[1]['digest'])
            if source_matches and mode == 'declarative':
                try:
                    versions = [inspect_image(f'docker://{name}:{version}') for name in names]
                    mirrors_match = bool(mirrors_match and all(versions) and versions[0]['digest'] == versions[1]['digest'])
                except RuntimeError:
                    mirrors_match = False
            repo = os.environ['GITHUB_REPOSITORY']
            workflow = github(f'repos/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}')["workflow_id"]
            failed = False
            page = 1
            while True:
                runs = github(f'repos/{repo}/actions/workflows/{workflow}/runs?head_sha={sha}&status=completed&per_page=100&page={page}')['workflow_runs']
                for run in runs:
                    if str(run['id']) == os.environ['GITHUB_RUN_ID'] or run['conclusion'] not in ('failure', 'timed_out', 'cancelled', 'startup_failure'):
                        continue
                    if not paths:
                        failed = True
                        break
                    jobs_page = 1
                    while True:
                        jobs = github(f'repos/{repo}/actions/runs/{run["id"]}/jobs?per_page=100&page={jobs_page}')['jobs']
                        if any(j['conclusion'] in ('failure', 'timed_out', 'cancelled') and f'({image})' in j['name'] for j in jobs):
                            failed = True
                        if len(jobs) < 100:
                            break
                        jobs_page += 1
                if failed or len(runs) < 100:
                    break
                page += 1
            manual = event == 'workflow_dispatch' or int(os.environ.get('GITHUB_RUN_ATTEMPT', '1')) > 1
            decision = build_decision(manual=manual, force=os.environ['FORCE'] == 'true',
                                      failed=failed, source_matches=source_matches, mirrors_match=mirrors_match)
            for current in images:
                if current and current['revision']:
                    assert_forward(current['revision'], sha, ancestor)
            print(f'{image}: {decision}')
            output({'build': str(decision == 'build').lower(), 'version': version, 'fingerprint': fingerprint})


        decide()

        PUBLISH_POLICY
