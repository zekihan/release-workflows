                    raise ValueError('Declared release differs between registries')
                # A dependency refresh may change edge without changing the declared release.
                # Recover a missing mirror from the existing immutable digest, not the new build.
                origin = next(i for i, item in enumerate(releases) if item)
                for i, current in enumerate(releases):
                    if current is None:
                        publish_copy(f'docker://{names[origin]}@{releases[origin]["digest"]}', f'docker://{names[i]}:{version}')
            elif version:
                for name, current in zip(names, releases):
                    if current is None:
                        publish_copy(source, f'docker://{name}:{version}')

            if version:
                published = [inspect_image(f'docker://{name}:{version}') for name in names]
                if not all(published) or published[0]['digest'] != published[1]['digest']:
                    raise ValueError('Release mirrors could not be verified')
                if mode == 'release' and published[0]['digest'] != candidate['digest']:
                    raise ValueError('Release verification differs from build')
                for name, release in zip(names, published):
                    verify_access(f'docker://{name}:{version}', release['digest'])
                for name, release in zip(names, published) if mode == 'declarative' else []:
                    current = inspect_image(f'docker://{name}:latest')
                    # Composite upstream versions are ordered by reviewed source history.
                    promote_latest = not current or current['digest'] == release['digest']
                    if current and current['revision'] and release['revision']:
                        promote_latest = ancestor(current['revision'], release['revision'])
                    if promote_latest:
                        publish_copy(f'docker://{name}@{release["digest"]}', f'docker://{name}:latest')
            if mode != 'release':
                for name in names:
                    publish_copy(source, f'docker://{name}:edge')
                for name in names:
                    remote = inspect_image(f'docker://{name}:edge')
                    if not remote or remote['digest'] != candidate['digest']:
                        raise ValueError('Development mirror verification failed')
                    verify_access(f'docker://{name}:edge', candidate['digest'])
            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                stream.write(f'Source: `{sha}`\n\nImage digest: `{candidate["digest"]}`\n')
            output({'digest': candidate['digest']})


        promote()

        PUBLISH_POLICY
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build-arm.result == 'skipped' || needs.build-arm.result
      == 'success') }}
  build-arm:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      if: ${{ hashFiles('go.mod') != '' }}
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      if: ${{ inputs.node-version != '' }}
      with:
        node-version: ${{ inputs.node-version }}
    - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
      if: ${{ hashFiles('.goreleaser.yaml') != '' }}
      with:
        version: ${{ inputs.goreleaser-version }}
        install-only: true
    - name: Prepare image inputs without publication credentials
      env:
        PREPARE: ${{ inputs.prepare-command }}
        MODE: ${{ inputs.mode }}
        RELEASE_VERSION: ${{ inputs.version }}
      run: bash -euo pipefail -c "$PREPARE"
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      if: ${{ inputs.qemu }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: ${{ inputs.context }}
        platforms: linux/arm64
        push: false
        outputs: type=oci,dest=${{ runner.temp }}/image.tar
        build-args: VERSION=${{ inputs.version || github.sha }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ inputs.version || github.sha }}
          io.zekihan.build-inputs=${{ inputs.fingerprint }}
        cache-from: type=gha,scope=${{ inputs.image }}-arm64
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}-arm64
    - name: Smoke-test the native image from the prepared archive
      if: ${{ inputs.smoke-command != 'true' }}
      env:
        SMOKE: ${{ inputs.smoke-command }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends skopeo
        skopeo copy --override-os linux --override-arch "$(go env GOARCH)" oci-archive:"$RUNNER_TEMP/image.tar" docker-daemon:local/publishing-smoke:latest
        bash -euo pipefail -c "$SMOKE"
    - id: checksum
      run: echo "sha256=$(sha256sum "$RUNNER_TEMP/image.tar" | cut -d " " -f 1)" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: artifact
      with:
        name: image-${{ inputs.image }}-arm64
        path: ${{ runner.temp }}/image.tar
        if-no-files-found: error
        retention-days: 7
    if: ${{ inputs.native-arm }}
