# Generated by scripts/render.py; edit scripts and regenerate.
name: Publish stable release
'on':
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      image:
        type: string
        default: ''
      image-digest:
        type: string
        default: ''
      chart-path:
        type: string
        default: ''
      chart-name:
        type: string
        default: ''
      binaries:
        type: boolean
        default: true
      github-release:
        type: boolean
        default: true
      prepare-command:
        type: string
        default: 'true'
      verify-command:
        type: string
        default: 'true'
      notes-file:
        type: string
        default: ''
      node-version:
        type: string
        default: ''
      goreleaser-version:
        type: string
        default: v2.20.0
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact-id }}
      sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: ${{ hashFiles('go.mod') != '' }}
      with:
        go-version-file: go.mod
        cache: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: ${{ inputs.node-version != '' }}
      with:
        node-version: ${{ inputs.node-version }}
    - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      if: ${{ hashFiles('.goreleaser.yaml') != '' }}
      with:
        version: ${{ inputs.goreleaser-version }}
        install-only: true
    - name: Prepare release without publication credentials
      env:
        PREPARE: ${{ inputs.prepare-command }}
        MODE: release
        RELEASE_VERSION: ${{ inputs.version }}
      run: bash -euo pipefail -c "$PREPARE"
    - if: ${{ inputs.binaries }}
      run: goreleaser release --clean --skip=publish,announce
    - env:
        VERIFY: ${{ inputs.verify-command }}
      run: bash -euo pipefail -c "$VERIFY"
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      if: ${{ inputs.chart-path != '' }}
      with:
        version: v4.3.1
    - if: ${{ inputs.chart-path != '' }}
      env:
        CHART_PATH: ${{ inputs.chart-path }}
        VERSION: ${{ inputs.version }}
      run: |
        helm lint "$CHART_PATH"
        helm package "$CHART_PATH" --version "$VERSION" --app-version "$VERSION" --destination dist
    - id: manifest
      env:
        NOTES_FILE: ${{ inputs.notes-file }}
      run: |
        python3 - <<'PY'
        import hashlib, json, os, pathlib, shutil
        dest = pathlib.Path('release-assets')
        dest.mkdir(exist_ok=True)
        manifest = {}
        for pattern in ('*.tar.gz', '*.zip', '*.tgz', 'checksums.txt', 'CHANGELOG.md'):
            for path in pathlib.Path('dist').glob(pattern):
                shutil.copyfile(path, dest / path.name)
                with path.open('rb') as stream:
                    manifest[path.name] = hashlib.file_digest(stream, 'sha256').hexdigest()
        notes = os.environ.get('NOTES_FILE')
        if notes:
            shutil.copyfile(notes, dest / 'CHANGELOG.md')
            manifest['CHANGELOG.md'] = hashlib.sha256((dest / 'CHANGELOG.md').read_bytes()).hexdigest()
        if manifest:
            checksums = ''.join(f'{digest}  {name}\n' for name, digest in sorted(manifest.items()) if name != 'checksums.txt')
            (dest / 'SHA256SUMS').write_text(checksums)
            manifest['SHA256SUMS'] = hashlib.sha256(checksums.encode()).hexdigest()
        data = json.dumps(manifest, sort_keys=True).encode()
        (dest / 'manifest.json').write_bytes(data)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('sha256=' + hashlib.sha256(data).hexdigest() + '\n')
        PY
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      id: artifact
      with:
        name: release-assets
        path: release-assets/
        if-no-files-found: error
        retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.build.outputs.artifact }}
        path: artifact
        merge-multiple: true
    - run: |
        if ! command -v skopeo >/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends skopeo
        fi
    - name: Verify prepared artifact before registry login
      env:
        EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        ARTIFACT_PATH: artifact/manifest.json
      run: |
        [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
        printf "%s  %s\n" "$EXPECTED_SHA256" "$ARTIFACT_PATH" | sha256sum --strict --check -
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
      if: ${{ inputs.image != '' }}
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: ${{ inputs.image != '' }}
    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      if: ${{ inputs.chart-path != '' }}
      with:
        version: v4.3.1
    - if: ${{ inputs.chart-path != '' }}
      env:
        TOKEN: ${{ github.token }}
      run: printf "%s" "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
    - env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        VERSION: ${{ inputs.version }}
        IMAGE: ${{ inputs.image }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        CHART_NAME: ${{ inputs.chart-name }}
        GITHUB_RELEASE: ${{ inputs.github-release }}
        MANIFEST_SHA256: ${{ needs.build.outputs.sha256 }}
      run: |
        python3 - <<'PUBLISH_POLICY'
        """Pure publishing decisions, also embedded verbatim in reusable workflows."""
        import re


        def stable_version(value):
            if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', value):
                raise ValueError('Expected a stable X.Y.Z version')
            return tuple(map(int, value.split('.')))


        def validate_version_history(version, tags):
            candidate = stable_version(version)
            for tag in tags:
                if re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
                    if stable_version(tag[1:]) > candidate:
                        raise ValueError('Release version is older than a stable tag in its source history')


        def release_identity(version, revision=None):
            if revision is None:
                stable_version(version)
                return version
            if not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.-]{0,110}', version):
                raise ValueError('Invalid upstream image version')
            if not re.fullmatch(r'[1-9]\d*', str(revision)):
                raise ValueError('Packaging revision must be a positive integer')
            return f'{version}-r{revision}'


        def build_decision(*, manual, force, failed, source_matches, mirrors_match):
            if force and not manual:
                raise ValueError('Force is only allowed on manual runs')
            if force:
                return 'build'
            if source_matches and mirrors_match:
                return 'skip-success'
            if failed and not manual:
                return 'skip-failure'
            return 'build'


        def immutable_decision(existing, candidate):
            if existing is None:
                return 'publish'
            if existing == candidate:
                return 'skip'
            raise ValueError('Immutable version already contains a different digest')


        def latest_decision(existing_version, candidate_version):
            candidate = stable_version(candidate_version)
            if existing_version is None:
                return True
            return candidate > stable_version(existing_version)


        def assert_forward(current, candidate, is_ancestor):
            if current is not None and current != candidate and not is_ancestor(current, candidate):
                raise ValueError('Refusing to replace a newer or unrelated source revision')


        def validate_platforms(index, required, single_platform=None):
            actual = {f"{m.get('platform', {}).get('os')}/{m.get('platform', {}).get('architecture')}"
                      for m in index.get('manifests', [])}
            if 'manifests' not in index and single_platform:
                actual = {single_platform}
            missing = set(required.split(',')) - actual
            if missing:
                raise ValueError(f'Missing image platforms: {sorted(missing)}')

        """Trusted registry and GitHub clients embedded into the workflow definition."""
        import hashlib
        import json
        import os
        import re
        from pathlib import Path
        import subprocess


        def command(args, *, missing=False):
            result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
            if result.returncode:
                error = result.stderr.decode(errors='replace')
                if missing and any(marker in error.lower() for marker in ('manifest unknown', 'name unknown', 'manifest_unknown')):
                    return None
                # Do not echo command arguments or registry responses containing credentials.
                raise RuntimeError(f'{args[0]} failed with exit code {result.returncode}')
            return result.stdout


        def inspect_image(reference):
            raw = command(['skopeo', 'inspect', '--raw', reference], missing=True)
            if raw is None:
                return None
            metadata = json.loads(command(['skopeo', 'inspect', '--override-os', 'linux', '--override-arch', 'amd64', reference]))
            return {'digest': metadata['Digest'], 'revision': metadata.get('Labels', {}).get('org.opencontainers.image.revision'),
                    'version': metadata.get('Labels', {}).get('org.opencontainers.image.version'),
                    'fingerprint': metadata.get('Labels', {}).get('io.zekihan.build-inputs'), 'index': json.loads(raw),
                    'platform': f"{metadata.get('Os')}/{metadata.get('Architecture')}"}


        def github(endpoint):
            return json.loads(command(['gh', 'api', endpoint]))


        def ancestor(old, new):
            if not all(re.fullmatch(r'[0-9a-f]{40}', value) for value in (old, new)):
                return False
            return subprocess.run(['git', 'merge-base', '--is-ancestor', old, new], check=False).returncode == 0


        def output(values):
            with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                for name, value in values.items():
                    value = str(value)
                    if '\n' in value or '\r' in value:
                        raise ValueError('Multiline workflow output rejected')
                    stream.write(f'{name}={value}\n')


        def image_names():
            image = os.environ['IMAGE']
            owner = os.environ['GITHUB_REPOSITORY_OWNER'].lower()
            docker_owner = os.environ['DOCKER_USERNAME']
            for value in (image, owner, docker_owner):
                if not re.fullmatch(r'[a-z0-9][a-z0-9_.-]*', value):
                    raise ValueError('Invalid image or registry namespace')
            return [f'ghcr.io/{owner}/{image}', f'docker.io/{docker_owner}/{image}']


        def publish_copy(source, destination):
            command(['skopeo', 'copy', '--all', '--preserve-digests', source, destination])


        def verify_access(reference, digest):
            if os.environ.get('PUBLIC_IMAGE') == 'true':
                remote = command(['skopeo', 'inspect', '--no-creds', '--format', '{{.Digest}}', reference]).decode().strip()
                if remote != digest:
                    raise ValueError('Anonymous pull does not resolve to the published image')


        def current_release_version(current):
            if current is None:
                return None
            value = (current.get('version') or '').removeprefix('v')
            try:
                stable_version(value)
                return value
            except ValueError:
                # Older metadata-action tags recorded "0" or "latest". Resolve their
                # declared version from the exact labelled source, never a branch head.
                revision = current.get('revision') or ''
                if not re.fullmatch(r'[0-9a-f]{40}', revision):
                    raise ValueError('Existing latest has no verifiable version/source metadata') from None
                value = command(['git', 'show', f'{revision}:VERSION']).decode().strip()
                stable_version(value)
                return value


        def verify_archive(path, expected):
            if not re.fullmatch(r'[0-9a-f]{64}', expected):
                raise ValueError('Missing or invalid expected artifact checksum')
            with Path(path).open('rb') as stream:
                digest = hashlib.file_digest(stream, 'sha256').hexdigest()
            if digest != expected:
                raise ValueError('Artifact checksum does not match build job output')

        def finalize():
            version = os.environ['VERSION']
            stable_version(version)
            tag = f'v{version}'
            if os.environ['GITHUB_REF'] != f'refs/tags/{tag}':
                raise ValueError('Release publication requires a matching existing tag')
            verify_archive('artifact/manifest.json', os.environ['MANIFEST_SHA256'])
            manifest = json.loads(Path('artifact/manifest.json').read_text())
            for name, checksum in manifest.items():
                if not re.fullmatch(r'[A-Za-z0-9_.+-]+', name) or name in ('.', '..', 'manifest.json'):
                    raise ValueError('Unsafe release asset filename')
                verify_archive(f'artifact/{name}', checksum)
            charts = [name for name in manifest if name.endswith('.tgz')]
            for name in charts:
                chart = os.environ['CHART_NAME']
                if name != f'{chart}-{version}.tgz':
                    raise ValueError('Unexpected chart name/version')
                destination = f'ghcr.io/{os.environ["GITHUB_REPOSITORY_OWNER"].lower()}/charts'
                existing = command(['skopeo', 'inspect', '--raw', f'docker://{destination}/{chart}:{version}'], missing=True)
                if existing is not None:
                    Path('existing-chart').mkdir(exist_ok=True)
                    command(['helm', 'pull', f'oci://{destination}/{chart}', '--version', version, '--destination', 'existing-chart'])
                    verify_archive(f'existing-chart/{name}', manifest[name])
                else:
                    command(['helm', 'push', f'artifact/{name}', f'oci://{destination}'])
                Path('verified-chart').mkdir(exist_ok=True)
                command(['helm', 'pull', f'oci://{destination}/{chart}', '--version', version, '--destination', 'verified-chart'])
                verify_archive(f'verified-chart/{name}', manifest[name])
                authenticated = command(['skopeo', 'inspect', '--raw', f'docker://{destination}/{chart}:{version}'])
                anonymous = command(['skopeo', 'inspect', '--no-creds', '--raw', f'docker://{destination}/{chart}:{version}'])
                if authenticated != anonymous:
                    raise ValueError('Anonymous chart access did not match authenticated verification')
            if os.environ['IMAGE']:
                for name in image_names():
                    release = inspect_image(f'docker://{name}:{version}')
                    if not release or release['digest'] != os.environ['IMAGE_DIGEST']:
                        raise ValueError('Released image does not match the verified image job')
                promotions = []
                for name in image_names():
                    current = inspect_image(f'docker://{name}:latest')
                    previous = current_release_version(current)
                    if previous == version:
                        immutable_decision(current['digest'], os.environ['IMAGE_DIGEST'])
                    if latest_decision(previous, version):
                        promotions.append(name)
                for name in promotions:
                    publish_copy(f'docker://{name}@{os.environ["IMAGE_DIGEST"]}', f'docker://{name}:latest')
                    if inspect_image(f'docker://{name}:latest')['digest'] != os.environ['IMAGE_DIGEST']:
                        raise ValueError('Latest verification failed')
            if os.environ['GITHUB_RELEASE'] != 'true':
                return
            existing = subprocess.run(['gh', 'release', 'view', tag, '--json', 'tagName'], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
            assets = [name for name in manifest if name != 'CHANGELOG.md']
            if existing.returncode == 0:
                # Never replace assets of an already published release on rerun.
                if assets:
                    Path('existing-release').mkdir(exist_ok=True)
                    command(['gh', 'release', 'download', tag, '--dir', 'existing-release'])
                    for name in assets:
                        verify_archive(f'existing-release/{name}', manifest[name])
                print('Release already exists with matching assets')
                return
            stable = []
            page = 1
            while True:
                releases = github(f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases?per_page=100&page={page}')
                stable.extend(stable_version(item['tag_name'].removeprefix('v')) for item in releases
                              if not item['prerelease'] and not item['draft'])
                if len(releases) < 100:
                    break
                page += 1
            newest = not stable or stable_version(version) > max(stable)
            args = ['gh', 'release', 'create', tag, '--verify-tag', '--title', tag, f'--latest={str(newest).lower()}']
            if 'CHANGELOG.md' in manifest:
                args += ['--notes-file', 'artifact/CHANGELOG.md']
            else:
                args += ['--generate-notes']
            command(args + ['--'] + [f'artifact/{name}' for name in assets])


        finalize()

        PUBLISH_POLICY
